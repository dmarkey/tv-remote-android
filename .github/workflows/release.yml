name: Release APK

# Publish a GitHub release (tag e.g. v1.1) and this builds, signs and attaches the APK.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.TVREMOTE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::TVREMOTE_KEYSTORE_B64 secret is not set; refusing to publish a debug-signed APK"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          TVREMOTE_STORE_FILE: ${{ runner.temp }}/release.jks
          TVREMOTE_STORE_PASSWORD: ${{ secrets.TVREMOTE_STORE_PASSWORD }}
          TVREMOTE_KEY_ALIAS: ${{ secrets.TVREMOTE_KEY_ALIAS }}
          TVREMOTE_KEY_PASSWORD: ${{ secrets.TVREMOTE_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.event.release.tag_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "TvRemote-$TAG.apk"
          gh release upload "$TAG" "TvRemote-$TAG.apk" --clobber
